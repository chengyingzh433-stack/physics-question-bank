{
  "$schema": "https://raw.githubusercontent.com/electron-userland/electron-builder/master/packages/app-builder-lib/scheme.json",
  "appId": "com.cyz.physics-question-bank",
  "productName": "物理教师题库管理系统",
  "directories": {
    "output": "release/${version}"
  },
  "npmRebuild": false,
  "files": [
    "out/main/**/*",
    "out/preload/**/*",
    "out/renderer/**/*",
    "package.json"
  ],
  "asarUnpack": [
    "node_modules/better-sqlite3/**/*"
  ],
  "extraResources": [
    {
      "from": "src/renderer/src/assets/fonts/NotoSansSC-Regular.ttf",
      "to": "fonts/NotoSansSC-Regular.ttf"
    }
  ],
  "win": {
    "target": [
      {
        "target": "nsis",
        "arch": ["x64"]
      }
    ]
  },
  "nsis": {
    "artifactName": "教师题库-测试版-${version}-安装程序.${ext}",
    "installerLanguages": ["zh_CN"],
    "language": "2052",
    "oneClick": false,
    "perMachine": false,
    "allowToChangeInstallationDirectory": true,
    "createDesktopShortcut": true,
    "createStartMenuShortcut": true,
    "shortcutName": "教师题库"
  }
}
